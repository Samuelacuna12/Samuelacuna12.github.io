<aside><div class="brand">INVICTO<span>↗</span></div><div class="brand-note">ESTADOS UNIDOS · 2027</div><div class="nav-label">TU PLAN, PASO A PASO</div><nav aria-label="Secciones del plan" id="nav"></nav><div class="aside-bottom"><strong>Una decisión a la vez.</strong>Compara, ajusta los números y avanza con evidencia.</div></aside>
<main><header class="topbar"><div class="crumb">Universo Invicto <span style="margin:0 10px">/</span> <strong id="crumb">Resumen</strong></div><div class="actions"><span class="pill">Plan 2027</span><button class="btn" id="export">Guardar copia ↓</button><label class="btn" for="import">Abrir copia ↑</label><input id="import" type="file" accept="application/json,.json" hidden></div></header><div class="content"><div id="view" class="fade"></div><footer class="footer"><span id="save-label">Cambios guardados solo en este navegador. No se sincronizan entre equipos.</span><button id="reset">Volver a los valores iniciales</button></footer></div></main><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Baseline planning assumptions from the October 2026 report. Not live quotes or live tax advice.
const BASE={fx:4000,origin:'col',coFob:2.2,coTax:12.5,coFreight:.4,coOther:.3,cnFob:1.6,cnTax:27.4,cnFreight:.35,cnOther:.3,pack:6,price:54.99,shipCharged:0,delivery:8.5,cac:14,returns:5,payment:2.9,payFixed:.3,orders:200,fixed:1500,units:3000,samples:1500,legal:5000,content:2000,ads:4500,setup:1500,reserve:7975,preOrders:200,prePrice:49.99,preCac:8,amazonPrice:54.99,amazonFba:6.25,amazonInbound:.65,amazonStorage:.25,amazonAds:20,retailPrice:15,retailFreight:.6,retailReserve:.3,retailRep:0,marks:1,classes:1,lawyer:1500,intent:true,extensions:0,state:'fl',owner:'sas',checks:{},channel:'web',marketing:'instagram'};
const KEY='invicto-usa-plan-v1';const safe=JSON.parse(JSON.stringify(BASE));let state={...safe};let storageOK=true;try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old)state=clean(old)}catch(e){storageOK=false}
function clean(o){const r=JSON.parse(JSON.stringify(BASE));if(!o||typeof o!=='object')return r;for(const k in BASE){if(typeof BASE[k]==='number'&&Number.isFinite(o[k]))r[k]=Math.max(0,Math.min(o[k],1e9));else if(typeof BASE[k]==='boolean'&&typeof o[k]==='boolean')r[k]=o[k];else if(typeof BASE[k]==='string'&&typeof o[k]==='string'&&o[k].length<30)r[k]=o[k]}for(const k of ['coTax','cnTax','returns','payment','amazonAds','retailRep'])r[k]=Math.min(r[k],100);r.fx=Math.max(1,r.fx);r.pack=[3,6,12].includes(r.pack)?r.pack:6;r.marks=Math.min(2,Math.max(1,Math.round(r.marks)));r.classes=Math.min(2,Math.max(1,Math.round(r.classes)));r.extensions=Math.min(5,Math.round(r.extensions));r.units=Math.round(r.units);r.orders=Math.round(r.orders);r.preOrders=Math.round(r.preOrders);r.origin=['col','china'].includes(r.origin)?r.origin:'col';r.state=['fl','wy','de'].includes(r.state)?r.state:'fl';r.owner=['sas','one','many'].includes(r.owner)?r.owner:'sas';r.channel=['web','amazon','retail','other'].includes(r.channel)?r.channel:'web';r.marketing=['instagram','email','whatsapp'].includes(r.marketing)?r.marketing:'instagram';if(o.checks&&typeof o.checks==='object')r.checks=Object.fromEntries(Object.entries(o.checks).filter(([k,v])=>/^t(?:[0-9]|1[0-5])$/.test(k)&&typeof v==='boolean'));return r}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}document.getElementById('save-label').textContent=storageOK?'Cambios guardados solo en este navegador. No se sincronizan entre equipos.':'No se pudo guardar en este navegador. Usa «Guardar copia» para conservar tus cambios.'}
const usd=x=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'USD',currencyDisplay:'narrowSymbol',maximumFractionDigits:2}).format(x);
const cop=x=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',currencyDisplay:'code',maximumFractionDigits:0}).format(x*state.fx);
const num=x=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:0}).format(x);
const pct=x=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:1}).format(x)+'%';
const pages=[['resumen','Tu punto de partida'],['produccion','¿Dónde producir?'],['ganancia','¿Cuánto me queda?'],['inversion','¿Cuánto necesito?'],['empresa','Empresa y marca'],['canales','¿Dónde vender?'],['marketing','¿Cómo atraer clientes?'],['plan','Qué hacer primero']];
function landed(origin=state.origin){return origin==='col'?state.coFob*(1+state.coTax/100)+state.coFreight+state.coOther:state.cnFob*(1+state.cnTax/100)+state.cnFreight+state.cnOther}
function calc(){const total=state.price+state.shipCharged,cost=landed()*state.pack,fee=total*state.payment/100+state.payFixed,ret=state.price*state.returns/100,before=total-cost-fee-ret-state.delivery;return {total,cost,fee,ret,before,left:before-state.cac,monthly:(before-state.cac)*state.orders-state.fixed}}
function budget(){return landed()*state.units+state.samples+state.legal+state.content+state.ads+state.setup+state.reserve}
function field(k,label,help='',step='.01',min='0',max='1000000000'){return `<label class="field"><span>${label}</span><input type="number" inputmode="decimal" data-key="${k}" value="${state[k]}" min="${min}" max="${max}" step="${step}" required>${help?`<small>${help}</small>`:''}</label>`}
function select(k,label,options,help=''){return `<label class="field"><span>${label}</span><select data-key="${k}">${options.map(([v,l])=>`<option value="${v}" ${String(state[k])===String(v)?'selected':''}>${l}</option>`).join('')}</select>${help?`<small>${help}</small>`:''}</label>`}
function row(label,value,cls=''){return `<div class="row ${cls}"><span>${label}</span><strong>${value}</strong></div>`}
function metric(label,value,sub){return `<div class="card"><div class="metric-label">${label}</div><div class="number">${value}</div><div class="sub">${sub}</div></div>`}
function title(tag,t,desc){return `<div class="eyebrow">${tag}</div><h1 tabindex="-1">${t}</h1><p class="intro">${desc}</p>`}
function note(t,warn=false){return `<div class="note ${warn?'warn':''}">${t}</div>`}
function details(t,b){return `<details><summary>${t}</summary>${b}</details>`}
function route(){const id=location.hash.slice(1);return pages.some(p=>p[0]===id)?id:'resumen'}
function overview(){const c=calc();return title('VISIÓN GENERAL','De Colombia a Estados Unidos.','Este es el plan explicado fácil. Empieza por la inversión y luego prueba tus propios números.')+`<div class="hero"><div><div class="eyebrow">RECOMENDACIÓN INICIAL</div><h2>Empezar pequeño.<br>Vender, aprender y reponer.</h2><p>Primera producción en Colombia, entrega desde USA y un pack de 6 como producto principal.</p><a class="btn primary" href="#ganancia">Probar cuánto me queda →</a></div><div class="hero-steps"><div><span class="stepnum">01</span>Validar producto y compradores</div><div><span class="stepnum">02</span>Vender en nuestra web</div><div><span class="stepnum">03</span>Abrir Amazon y tiendas</div></div></div><div class="grid four">${metric('Dinero para el piloto',usd(budget()),cop(budget())+' · inversión estimada')}${metric('Precio del paquete',usd(state.price),state.pack+' prendas · precio editable')}${metric('Queda por pedido',usd(c.left),'Antes de gastos fijos e impuesto de renta')}${metric('Primera prueba',usd(4500),'Incluida en el piloto; no se suma otra vez')}</div><div class="grid two section-gap"><div class="card"><span class="badge">DECISIÓN DE NEGOCIO</span><h2 style="margin-top:15px">¿Por qué Colombia primero?</h2><p>Podemos corregir tallas y calidad con lotes más pequeños. China se evalúa cuando tengamos ventas repetidas y cotizaciones reales.</p><a href="#produccion" class="mini-link">Comparar los dos países →</a></div><div class="card"><span class="badge">PRÓXIMO PASO</span><h2 style="margin-top:15px">Antes de comprar inventario</h2><p>Aprobar muestras, cotizar transporte, definir empresa y comprobar que el precio deja dinero después de los anuncios.</p><a href="#plan" class="mini-link">Ver mi lista de tareas →</a></div></div>${note('Todos los importes son escenarios de planeación en USD, no cotizaciones. Los impuestos parten del estudio de octubre de 2026 y se deben confirmar para 2027. Puedes cambiar cada supuesto.')}`}
function production(){return title('01 / PRODUCTO','¿Dónde nos conviene producir?','Compara cuánto cuesta una prenda lista para vender desde una bodega en USA.')+`<div class="grid two">${['col','china'].map((o,i)=>`<div class="card"><div class="pair"><h2>${i?'China':'Colombia'}</h2><span class="badge">${i?'Para comparar':'Inicio recomendado'}</span></div><div class="fields">${field(i?'cnFob':'coFob','Precio de fábrica / FOB','USD por prenda terminada y empacada')}${field(i?'cnTax':'coTax','Impuestos de importación','% sobre el valor FOB','.1','0','100')}${field(i?'cnFreight':'coFreight','Transporte internacional','USD por prenda, con seguro')}${field(i?'cnOther':'coOther','Otros costos de entrada','USD por prenda: control, agencia y recepción')}</div><div id="${o}-total" class="section-gap"></div></div>`).join('')}</div><div id="comparison"></div><div class="card section-gap"><h2>¿Con cuál quieres hacer los cálculos?</h2><div class="fields">${select('origin','Producción para tus simulaciones',[['col','Colombia'],['china','China']])}${field('units','Cantidad del primer lote','Número de prendas','1')}</div>${details('¿Qué significan estos impuestos?',`<p>El ejemplo usa bóxer de algodón. Colombia: 12,5% si cumple las reglas del TLC. China: 27,4% total modelado. Si no califica el origen o cambia la fibra, las tasas pueden ser diferentes.</p><p>El TLC no garantiza cero impuestos totales. Cambia el porcentaje cuando el agente aduanero confirme la clasificación y las reglas vigentes al embarcar.</p>`)}${details('¿Qué hay que pedir a las fábricas?',`<ul><li>Composición, gramaje, medidas y muestra real.</li><li>Precio con el mismo empaque y calidad para ambos países.</li><li>Compra mínima por color y talla; plazo y forma de pago.</li><li>Origen de hilo/tela y documentos de trazabilidad.</li><li>Peso y dimensiones de cajas para cotizar transporte.</li></ul><p>Los valores FOB aquí son supuestos. No se obtuvieron cotizaciones de fábricas.</p>`)}${details('¿Cuándo considerar China?',`<p>Después de dos reposiciones rentables, calidad estable y un ahorro suficiente para compensar el lote mínimo y el tiempo de entrega. Objetivo orientativo: ahorrar al menos USD 0,50 por prenda o 15-20%, sin perder calidad.</p>`)} </div>`}
function profits(){return title('02 / PRECIO Y GANANCIA','¿Cuánto me queda de cada venta?','Mueve los números. “Me queda” es lo disponible para pagar gastos fijos y, después, impuestos sobre la utilidad.')+`<div class="grid two"><div class="card"><h2>Así sería el pedido</h2><div class="fields">${select('pack','Tamaño del paquete',[[3,'3 prendas'],[6,'6 prendas'],[12,'12 prendas']],'Cambiar el paquete carga su precio y envío de referencia.')}${field('price','Precio del paquete','USD, sin impuesto de ventas')}${field('cac','Publicidad por cliente','Lo que gastas para conseguir una compra')}${field('delivery','Preparación y entrega USA','USD por pedido')}${field('shipCharged','Envío cobrado al cliente','0 si ofreces envío gratis')}${field('returns','Reserva para incidencias','% de venta: devoluciones, cambios y fallas','.1','0','100')}</div>${details('Más ajustes',`<div class="fields section-gap">${field('payment','Comisión de pago','Porcentaje de mercancía + envío','.1','0','100')}${field('payFixed','Cargo fijo de pago','USD por transacción')}${select('origin','Origen del producto',[['col','Colombia'],['china','China']])}</div>`)}<p class="sub section-gap">El costo de la prenda viene del comparador de producción.</p></div><div><div id="profit-answer"></div><div id="profit-detail" class="card section-gap"></div></div></div><div class="card section-gap"><h2>¿Y en un mes?</h2><div class="fields">${field('orders','Pedidos al mes','Todos con el mismo paquete de esta simulación','1')}${field('fixed','Gastos fijos mensuales','Equipo, herramientas, contabilidad y otros')}</div><div id="monthly" class="section-gap"></div></div>${note('No incluye impuesto de renta ni remuneraciones que no hayas puesto en gastos fijos. La reserva de incidencias es un costo estimado: no se descuenta una segunda vez. El impuesto de ventas cobrado al cliente no es ganancia.')}`}
function investment(){return title('03 / CAPITAL','¿Cuánto dinero necesito?','El piloto se financia por etapas. Primero comprobamos que el producto y la oferta funcionan.')+`<div class="grid two"><div class="card"><h2>Arma tu presupuesto</h2><div class="fields">${field('units','Prendas del primer lote','','1')}${field('samples','Muestras y pruebas','USD')}${field('legal','Empresa, marca y contratos','USD; reserva, no cotización')}${field('content','Web, fotos y contenido','USD')}${field('ads','Publicidad inicial','USD')}${field('setup','Operación de arranque','USD; un mes estimado')}${field('reserve','Reserva y reposición','USD para caja e imprevistos')}${field('fx','Pesos por dólar','Tasa de planeación; no TRM en vivo','1','1')}</div></div><div><div id="budget-answer"></div><div class="card section-gap"><h2>Dos etapas, una inversión</h2>${row('1. Validar',usd(4500))}<p class="sub">Muestras, contenido, tráfico y revisión inicial. Ya está incluido en el total.</p><div id="budget-rest"></div><p class="sub">Liberar el resto después de validar tallas, costos y compradores.</p></div></div></div><div class="card section-gap"><h2>¿Cuánto puede aportar la preventa?</h2><p class="sub">No es dinero libre: todavía debes producir y entregar los pedidos.</p><div class="fields section-gap">${field('preOrders','Pedidos anticipados','Cada uno contiene 6 prendas','1')}${field('prePrice','Precio anticipado','USD por pack de 6')}${field('preCac','Publicidad por preventa','USD por comprador')}</div><div id="pre-result" class="section-gap"></div>${details('Reglas para cobrar antes de entregar',`<ul><li>Tener muestra final y fecha de despacho razonable.</li><li>Mostrar “preventa” y fecha antes del pago.</li><li>Actualizar semanalmente y avisar cualquier retraso.</li><li>Ofrecer cancelación/reembolso conforme a reglas aplicables.</li><li>Conservar caja para cumplir; no gastar todo el recaudo.</li></ul>`)} </div>`}
function company(){return title('04 / EMPRESA Y MARCA','¿Cómo abrimos la empresa?','Primero se define quién es el dueño y dónde operará. Después se escoge la forma de empresa.')+`<div class="grid two"><div class="card"><h2>1. ¿Quién será propietario?</h2>${select('owner','Propietario de la operación USA',[['sas','Universo Invicto SAS'],['one','Una persona'],['many','Dos o más personas']])}<div id="owner-result" class="section-gap"></div>${details('LLC, explicado fácil',`<p>Es una sociedad de responsabilidad limitada. Puede tener uno o varios dueños. Para impuestos puede tratarse de distintas formas: no significa “cero impuestos”.</p>`)}${details('Corporación C, explicado fácil',`<p>La empresa paga impuesto sobre su utilidad. Al repartir dividendos a un dueño extranjero puede existir otra retención. Puede ser útil para separar la operación y reinvertir, pero hay que comparar ambos países.</p>`)}${details('¿Por qué no una S-corporation?',`<p>No admite directamente a la SAS ni a personas extranjeras no residentes como accionistas. Ser colombiano y ser residente fiscal de USA son cosas distintas.</p>`)} </div><div class="card"><h2>2. ¿En qué estado?</h2>${select('state','Estado a comparar',[['fl','Florida'],['wy','Wyoming'],['de','Delaware']])}<div id="state-result" class="section-gap"></div><p class="sub section-gap">Tarifas estatales para LLC consultadas en octubre de 2026. No incluyen agente comercial, abogado, contabilidad ni impuestos.</p>${details('¿Y una corporation en Florida?',`<p>Referencia oficial: USD 70 de constitución y USD 150 de reporte anual. La LLC tiene tarifas distintas. Los servicios profesionales se pagan aparte.</p>`)} </div></div><div class="card section-gap"><h2>3. ¿Cuánto cuesta proteger la marca?</h2><p>Primero buscar nombres similares. Después solicitar <strong>UNIVERSO INVICTO</strong> para ropa interior. La disponibilidad jurídica aún no está confirmada.</p><div class="fields section-gap">${select('marks','Qué quieres registrar',[[1,'Solo el nombre'],[2,'Nombre y logo por separado']])}${select('classes','Clases por cada solicitud',[[1,'1 clase: prendas (25)'],[2,'2 clases: prendas + servicios (si aplica)']])}${field('lawyer','Abogado y búsqueda','Provisión USD, editable')}${select('intent','¿Usaremos intención de uso?',[[true,'Sí, todavía no usamos la marca en USA'],[false,'No, otra base válida confirmada']])}</div><div id="trademark-result" class="section-gap"></div>${details('Qué incluye y qué falta',`<p>Tasa base: USD 350 por marca/clase. Intención de uso agrega USD 150 por clase al acreditar uso. Cada prórroga puede costar USD 125 por clase. No se incluyen prórrogas, recargos, oposiciones ni renovaciones en esta calculadora.</p><p>Clase 25 protege prendas; clase 35 solo si corresponde proteger servicios. El abogado confirma descripción y vía. Un registro colombiano vigente puede permitir otra base.</p><p>Si la SAS es dueña de la marca, puede solicitarla y licenciar a la subsidiaria. El titular domiciliado fuera de USA necesita abogado estadounidense. Registrar una empresa o un dominio no registra la marca.</p>`)} </div><div class="card section-gap"><h2>Los impuestos, en cuatro ideas</h2>${details('Al importar: impuesto sobre la mercancía',`<p>Depende del país, material y origen. Está incluido en el comparador de producción.</p>`)}${details('Al vender: sales tax',`<p>Se recauda del cliente cuando corresponde y se entrega al estado. No es utilidad. La bodega o el inventario pueden crear obligaciones; Amazon no resuelve automáticamente las de nuestra web.</p>`)}${details('Al ganar: impuesto sobre la utilidad',`<p>La tasa federal general de C-corporation es 21% sobre utilidad fiscal, no ventas. Florida tiene reglas propias: tasa corporativa general de 5,5%, con exención y ajustes aplicables. La LLC no tiene una sola tasa universal.</p>`)}${details('Al retirar dinero: puede haber otra retención',`<p>Ejemplo simplificado C-corp, sin estado ni Colombia: de USD 100.000 de utilidad, 21.000 serían impuesto federal. Si distribuyes los 79.000 restantes y aplica retención del 30%, el dueño recibe 55.300. No aplica igual a toda estructura.</p><p>Una LLC propiedad de una SAS puede generar obligaciones directas para la SAS. Antes de abrir, un asesor binacional debe comparar reinversión, dividendos y reportes. Algunas sanciones por reportes extranjeros son altas incluso con ventas cero.</p>`)} </div>${note('Recomendación inicial: Florida si allí estará la operación real. La decisión LLC/corporación depende de propietarios y fiscalidad. Las calculadoras no reemplazan esa revisión y no presentan impuestos como definitivos para 2027.')}`}
const CHANNELS={web:['Nuestra web','Primero validamos la oferta y nos quedamos con la relación con el cliente.',['Elegir un solo producto principal|Pack de 6, tallas claras y colores definidos.','Preparar una compra fácil|Precio en USD, tarjeta, fecha de entrega y soporte bilingüe.','Abrir lista de espera|Captar email, idioma y talla; sin cobrar hasta estar listos.','Cobrar una preventa limitada|Solo con muestra aprobada y fecha de despacho realista.','Reponer lo que sí se vende|Medir ganancia por pedido y fallas por talla antes de ampliar.']],amazon:['Amazon','Entrar después de comprobar calidad y talla en los primeros clientes.',['Preparar cuenta y marca|Identidad, banco y datos fiscales consistentes; marca/GTIN según requisitos.','Crear un pack cerrado|Fotos reales, contenido exacto, tabla de tallas y empaque medido.','Enviar un lote pequeño|Propuesta: 100-150 packs de 6, repartidos por tallas comprobadas.','Medir publicidad y devoluciones|No escalar solo por facturación. Revisar lo que queda por pedido.','Conseguir reseñas honestas|Vine si elegible. Sin comprar estrellas ni incentivos por reseñas positivas.']],retail:['Tiendas y mayoristas','Comenzar con tiendas independientes que puedan vender y volver a pedir.',['Preparar oferta mayorista|Pack de 3 a USD 15 como referencia; precio sugerido USD 29,99.','Seleccionar 100 tiendas|Misma región, categoría adecuada y comprador identificado.','Presentar muestras y catálogo corto|Precio, tallas, mínimo, entrega, seguro y condiciones.','Vender el primer pedido prepagado|Referencia: 24 packs de 3 = 72 prendas = USD 360.','Revisar ventas a 30-45 días|Reponer tallas ganadoras; crédito solo después de evaluar al cliente.']],other:['Otros sitios','Sumar canales cuando podamos atenderlos con margen e inventario.',['Google Shopping|Feed limpio, precios y disponibilidad iguales a la web.','Faire|Evaluar país de la entidad: comisiones y cargos pueden reducir mucho el margen.','Walmart Marketplace|Confirmar elegibilidad, historial ecommerce, códigos de producto y devoluciones USA.','TikTok Shop|Validar entidad, identidad, políticas y comisiones vigentes antes de presupuestarlo.','Cadenas grandes|Después de comprobar reposición y poder financiar plazos, seguros y exigencias.']]};
function channels(){return title('05 / VENTAS','¿Dónde empezamos a vender?','Cada canal tiene una función y un costo diferente. Empieza por la web; abre los demás con resultados comprobados.')+`<div class="tabs" aria-label="Canal">${Object.entries(CHANNELS).map(([k,v])=>`<button data-channel="${k}" class="${state.channel===k?'active':''}" aria-pressed="${state.channel===k}">${v[0]}</button>`).join('')}</div><div class="grid two"><div class="card"><h2>${CHANNELS[state.channel][0]}</h2><p class="sub">${CHANNELS[state.channel][1]}</p>${CHANNELS[state.channel][2].map((x,i)=>{const [a,b]=x.split('|');return `<div class="channel-step"><b>0${i+1}</b><div><h3>${a}</h3><p>${b}</p></div></div>`}).join('')}</div><div class="card">${channelCalc()}</div></div>`}
function channelCalc(){if(state.channel==='amazon')return `<h2>Calcula el pack de 6 en Amazon</h2><div class="fields">${field('amazonPrice','Precio del pack','USD')}${field('amazonAds','Publicidad','% de venta','.1','0','100')}${field('amazonFba','Preparación y entrega FBA','USD; confirmar con peso y medidas')}${field('amazonInbound','Entrada a Amazon','USD por pack')}${field('amazonStorage','Almacenaje','USD imputado por pack')}</div><div id="amazon-result" class="section-gap"></div><p class="sub">Comisión ropa: 5% hasta USD 15; 10% hasta USD 20; 17% por encima; mínimo USD 0,30. La tarifa FBA es un supuesto inclusivo, no una cotización. Faltan cuota mensual y gastos fijos.</p>`;if(state.channel==='retail')return `<h2>Calcula el pack de 3 mayorista</h2><div class="fields">${field('retailPrice','Precio a la tienda','USD por pack de 3')}${field('retailFreight','Transporte a la tienda','USD por pack')}${field('retailReserve','Reserva comercial','USD por pack')}${field('retailRep','Comisión del vendedor','% sobre la factura','.1','0','100')}</div><div id="retail-result" class="section-gap"></div><p class="sub">Venta directa. Si usas Faire, descuenta además sus comisiones, procesamiento y cargos aplicables.</p>`;if(state.channel==='other')return `<h2>No abrir todo al mismo tiempo</h2><p>Más sitios implican más inventario reservado, tarifas, devoluciones y trabajo.</p>${note('Criterio de entrada: cada nuevo canal debe dejar dinero después de todos sus costos.')}<p class="sub">La elegibilidad y las tarifas deben confirmarse cuando se abra cada cuenta en 2027.</p>`;return `<h2>Oferta de inicio</h2>${row('Pack de 3','USD 29,99 + envío')}${row('Pack de 6','USD 54,99')}${row('Preventa de 6','USD 49,99')}${row('Recompra de 12','USD 99,99')}<p class="sub section-gap">Referencias originales del plan, no cambios automáticos a tu simulación. Valores antes de sales tax.</p><a href="#ganancia" class="btn dark section-gap">Calcular mi ganancia →</a>${note('Entregar desde USA evita depender del envío internacional individual para cada pedido.')}`}
const MARKETING={instagram:['Instagram y creadores','Demostrar el producto antes de pedir la compra.',['3 videos de uso por semana|Trabajo, viaje y comodidad cotidiana con personas reales.','1 demostración de producto|Medidas, cintura, costuras y lavado. Sin promesas sin probar.','1 historia de fabricación|Quién lo hace y qué cuidamos en Colombia.','2 carruseles de preguntas|Talla, packs, entrega y cambios.','10-15 microcreadores para probar|Audiencia real en USA, derechos de uso y publicidad declarada.']],email:['Correos','El canal principal para acompañar la compra y la recompra.',['Cuando se registra|Bienvenida, propuesta y guía de talla.','Días 2, 4 y 6|Pruebas del producto, objeciones y acceso a la oferta. Detener si compra.','Carrito sin compra|Ayuda a 1 hora, recordatorio a 24 y 48 horas según permiso.','Después de la entrega|Cuidado, ayuda de talla y solicitud de evaluación honesta.','A los 60-180 días|Comprobar satisfacción y ofrecer reposición cuando tenga sentido.']],whatsapp:['WhatsApp','Ayudar a comprar; no hacer depender las ventas de mensajes masivos.',['Botón opcional en la web|Que el cliente pueda iniciar la conversación.','Responder talla y entrega|Mensajes cortos, inglés/español y horario claro.','Conectar atención con el pedido|Seguimiento real y escalamiento humano para problemas.','Respetar las reglas de Meta|Las plantillas de marketing a números USA están restringidas según el estudio.','Recuperar y recomprar por email|No disfrazar publicidad de notificaciones de servicio.']]};
function marketing(){const m=MARKETING[state.marketing];return title('06 / CLIENTES','¿Cómo hacemos que nos compren?','Mostrar el producto → llevar a la web → resolver dudas → entregar bien → invitar a recomprar.')+`<div class="tabs">${Object.entries(MARKETING).map(([k,v])=>`<button data-marketing="${k}" class="${state.marketing===k?'active':''}" aria-pressed="${state.marketing===k}">${v[0]}</button>`).join('')}</div><div class="grid two"><div class="card"><h2>${m[0]}</h2><p class="sub">${m[1]}</p>${m[2].map((x,i)=>{const[a,b]=x.split('|');return `<div class="channel-step"><b>0${i+1}</b><div><h3>${a}</h3><p>${b}</p></div></div>`}).join('')}</div><div class="card"><h2>Primer mes de contenido</h2>${row('Semana 1','Presentar el problema')}${row('Semana 2','Mostrar ajuste y calidad')}${row('Semana 3','Responder dudas reales')}${row('Semana 4','Invitar a la preventa')}<div class="note">Una publicación = una idea + una prueba + una acción clara.</div><h3>Lo que sí debemos medir</h3><ul><li>Cuánto cuesta conseguir una compra.</li><li>Cuánto queda después de entregarla.</li><li>Qué tallas generan problemas.</li><li>Cuántos clientes vuelven.</li></ul><p class="sub">Los seguidores y las vistas por sí solos no pagan el inventario.</p></div></div><div class="card section-gap"><h2>Publicidad: empezar con una prueba</h2><p>Presupuesto inicial propuesto: USD 1.500 en medios. Probar 3 mensajes, en inglés y español, con pocas campañas.</p><div class="grid three">${metric('Meta',usd(1000),'Probar mensajes y creatividades')}${metric('Búsqueda',usd(250),'Personas con intención de compra')}${metric('Reserva',usd(250),'Retargeting si existe audiencia')}</div>${details('Cómo saber si el anuncio funciona',`<p>Ejemplo: un clic de USD 0,70 y 2 compras por cada 100 visitas significa USD 35 de publicidad por comprador. Eso supera el objetivo inicial de USD 14-15 del pack de 6.</p><p>Si no deja margen, mejorar precio, conversión o costo de publicidad antes de aumentar el presupuesto. No convertir una venta aislada en una promesa de resultado.</p>`)}${details('Sistema de correos que necesitamos',`<p>Shopify Email para empezar simple; Klaviyo si necesitamos más segmentación. Guardar idioma, fuente, permiso y estado del pedido. Configurar autenticación del dominio, baja fácil y mensajes separados por propósito.</p>`)} </div>`}

function plan(){let i=0;return title('07 / EJECUCIÓN','¿Qué hacemos primero?','Marca lo que ya esté terminado. Las fechas son objetivos: avanzamos cuando la etapa esté lista.')+`<div id="progress" class="card" style="margin-bottom:22px"></div><div class="grid two">${TASKS.map(([t,date,items])=>`<section class="card"><div class="eyebrow">${date}</div><h2 style="margin-top:10px">${t}</h2>${items.map(([a,b])=>{const k='t'+i++;return `<label class="task"><input type="checkbox" data-task="${k}" ${state.checks[k]?'checked':''}><span><strong>${a}</strong><small>${b}</small></span></label>`}).join('')}</section>`).join('')}<section class="card"><span class="badge">REGLA PARA AVANZAR</span><h2 style="margin-top:14px">Comprar más solo si funciona.</h2><p>Calidad estable, pedidos que dejan dinero y caja para reponer.</p>${note('Si hay problemas repetidos de talla, pérdidas por pedido o falta de caja para entregar, corregimos antes de escalar.',true)}<p class="sub">Marcar una tarea no valida automáticamente el negocio. Es tu registro personal del avance.</p></section></div>`}
const views={resumen:overview,produccion:production,ganancia:profits,inversion:investment,empresa:company,canales:channels,marketing,plan};
function render(){const r=route();document.getElementById('nav').innerHTML=pages.map(([id,t],i)=>`<a href="#${id}" ${r===id?'aria-current="page"':''}><b>${String(i+1).padStart(2,'0')}</b>${t}</a>`).join('');document.getElementById('crumb').textContent=pages.find(x=>x[0]===r)[1];const v=document.getElementById('view');v.classList.remove('fade');v.innerHTML=views[r]();v.classList.add('fade');update();persist()}
function put(id,html){const el=document.getElementById(id);if(el)el.innerHTML=html}
function update(){const c=calc(),a=landed('col'),b=landed('china');put('col-total',row('Lista para vender en USA',usd(a)+' / prenda','total'));put('china-total',row('Lista para vender en USA',usd(b)+' / prenda','total'));put('comparison',note(a===b?'Con estos valores, el costo por prenda es igual.':`En este escenario, ${a>b?'China':'Colombia'} cuesta <strong>${usd(Math.abs(a-b))} menos por prenda</strong>. En ${num(state.units)} prendas: ${usd(Math.abs(a-b)*state.units)} de diferencia. El lote mínimo y el tiempo de entrega también importan.`));
put('profit-answer',`<div class="answer ${c.left<0?'loss':''}"><h2>${c.left<0?'Este pedido pierde':'De este pedido quedan'}</h2><div class="number">${usd(c.left)}</div><p>${cop(c.left)} por pedido</p><div class="sub">Antes de gastos fijos e impuesto de renta. ${c.total>0?pct(c.left/c.total*100)+' de lo cobrado.':''}</div></div>`);put('profit-detail',`<h2>¿A dónde se va el dinero?</h2>${row('Cliente paga',usd(c.total))}${row('Prendas puestas en USA','− '+usd(c.cost))}${row('Pasarela de pago','− '+usd(c.fee))}${row('Preparación y entrega','− '+usd(state.delivery))}${row('Reserva de incidencias','− '+usd(c.ret))}${row('Publicidad','− '+usd(state.cac))}${row('Queda por pedido',usd(c.left),'total')}<p class="sub section-gap">Publicidad máxima para no perder por pedido: ${c.before>0?usd(c.before):'ni con publicidad gratis alcanza'}. Ese límite todavía no cubre gastos fijos.</p>`);
const breakeven=c.left>0?Math.ceil(state.fixed/c.left):null;put('monthly',`<div class="grid three">${metric('Ventas mensuales',usd(c.total*state.orders),num(state.orders)+' pedidos')}${metric('Después de gastos fijos',usd(c.monthly),'Antes de impuesto de renta')}${metric('Pedidos para cubrir fijos',breakeven===null?'No alcanza':num(breakeven),breakeven===null?'Cada pedido debe dejar dinero primero.':'Con el mismo precio y costos.')}</div>`);
put('budget-answer',`<div class="answer"><h2>Capital estimado para el piloto</h2><div class="number">${usd(budget())}</div><p>${cop(budget())}</p><div class="sub">Inventario + preparación + lanzamiento + reserva.</div></div>`);put('budget-rest',row('2. Capital restante',usd(Math.max(0,budget()-4500)))+row('Inventario incluido en total',usd(landed()*state.units)));const preRevenue=state.preOrders*state.prePrice,preUnit=state.prePrice-6*landed()-(state.prePrice*state.payment/100+state.payFixed)-8.5-state.prePrice*state.returns/100-state.preCac;put('pre-result',`<div class="grid three">${metric('Cobro anticipado',usd(preRevenue),'Antes de sales tax y retenciones de pasarela')}${metric('Costo previsto de cumplir',usd((state.prePrice-preUnit)*state.preOrders),'Producto, entrega, pago, publicidad e incidencias')}${metric('Contribución estimada',usd(preUnit*state.preOrders),'Antes de gastos fijos y renta')}</div><p class="sub section-gap">Usa el origen elegido, 6 prendas y USD 8,50 de entrega por pedido. No se resta esta preventa automáticamente al capital del piloto.</p>`);
const owners={sas:'Evaluaría una subsidiaria con tributación C-corporation. Compararla con una LLC transparente para evitar exponer a la SAS a obligaciones inesperadas en USA.',one:'Una LLC de un dueño puede ser sencilla jurídicamente, pero los impuestos dependen de residencia y actividad. Solo si el negocio y la marca realmente pertenecen a esa persona.',many:'Una LLC de varios socios suele tributar como partnership por defecto. Puede haber declaraciones y retenciones por socios extranjeros, incluso sin repartir dinero.'};put('owner-result',note(owners[state.owner])+`<p class="sub">Decisión para revisar con asesor USA/Colombia antes de presentar documentos.</p>`);const states={fl:[125,138.75,'Mi punto de partida si operaremos en Florida. Crear en otro estado no elimina obligaciones donde tenemos actividad.'],wy:[100,60,'Costo estatal menor. Si también debemos registrarnos donde operamos, pueden sumarse dos estados. Anual mínimo: puede aumentar por activos en Wyoming.'],de:[110,400,'Más sentido si la estructura o futuros inversores lo requieren. No lo elegiría solo por ahorro para este piloto.']};const st=states[state.state];put('state-result',row('Abrir la LLC',usd(st[0]))+row('Cargo anual estatal',usd(st[1]))+note(st[2]));const gov=state.marks*state.classes*(350+(state.intent?150:0));put('trademark-result',`<div class="grid three">${metric('Tasas oficiales estimadas',usd(gov),state.intent?'Incluye acreditar uso posteriormente':'Solo solicitud base, según vía válida')}${metric('Abogado y búsqueda',usd(state.lawyer),'Provisión editable; no cotización')}${metric('Presupuesto de marca',usd(gov+state.lawyer),cop(gov+state.lawyer))}</div><p class="sub section-gap">Estimación independiente: revisa que quepa dentro de la reserva legal del piloto. No se suma automáticamente a esa reserva.</p>`);
const ref=state.amazonPrice<=15?.05:state.amazonPrice<=20?.10:.17;const referral=Math.max(.30,state.amazonPrice*ref);const am=state.amazonPrice-6*landed()-referral-state.amazonFba-state.amazonInbound-state.amazonStorage-state.amazonPrice*(state.returns+state.amazonAds)/100;put('amazon-result',row('Comisión Amazon',usd(referral))+row('Publicidad',usd(state.amazonPrice*state.amazonAds/100))+row('Queda por pack de 6',usd(am),'total')+note('Usa el país elegido y la misma reserva de incidencias de la calculadora. No incluye cuota mensual ni impuesto de renta.'));const rt=state.retailPrice-3*landed()-state.retailFreight-state.retailReserve-state.retailPrice*state.retailRep/100;put('retail-result',row('Producto (3 prendas)',usd(3*landed()))+row('Queda por pack mayorista',usd(rt),'total')+row('Margen bruto de tienda a 29,99',pct((29.99-state.retailPrice)/29.99*100)));const done=Object.values(state.checks).filter(Boolean).length;put('progress',`<div class="pair"><strong>${done} de 16 tareas terminadas</strong><span class="badge">${Math.round(done/16*100)}%</span></div><div class="bar"><span style="width:${done/16*100}%"></span></div><p class="sub" style="margin-top:12px;margin-bottom:0">Tu avance se guarda en este navegador. Usa «Guardar copia» para llevarlo a otro equipo.</p>`)}
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.key;if(!k||el.tagName==='SELECT')return;if(!el.checkValidity()||el.value==='')return;state[k]=Number(el.value);state=clean(state);persist();update()});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.key;if(el.dataset.task){state.checks[el.dataset.task]=el.checked;persist();update();return}if(k&&el.tagName==='SELECT'){state[k]=typeof BASE[k]==='number'?Number(el.value):typeof BASE[k]==='boolean'?el.value==='true':el.value;if(k==='pack'){const p={3:[29.99,4.99,7.5],6:[54.99,0,8.5],12:[99.99,0,10]}[state.pack];[state.price,state.shipCharged,state.delivery]=p;render()}else{persist();update()}}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.channel){state.channel=b.dataset.channel;render()}if(b.dataset.marketing){state.marketing=b.dataset.marketing;render()}});
let toastTimer;function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4000)}
document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,savedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='invicto-usa-mi-escenario.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia descargada. Incluye tus números y tareas.')});
document.getElementById('import').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>100000)throw Error();const o=JSON.parse(await f.text());if(o.version!==1||!o.state||typeof o.state!=='object')throw Error();if(!confirm('¿Reemplazar los números y tareas de este navegador con esta copia?'))return;state=clean(o.state);render();toast('Copia cargada correctamente.')}catch(err){toast('No se pudo abrir. Selecciona una copia JSON de este sistema.')}finally{e.target.value=''}});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('¿Restaurar los valores del plan y borrar las tareas marcadas en este navegador?')){state=JSON.parse(JSON.stringify(BASE));render();toast('Valores iniciales restaurados.')}});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});document.querySelector('h1')?.focus({preventScroll:true})});render();
